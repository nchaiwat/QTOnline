events {
    worker_connections 1000;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Performance: Keepalive Connection Pool to Gunicorn
    upstream flask_app {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name qol.windowasia.com;

        # Increase upload limit for documents
        client_max_body_size 50M;

        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable caching for all pages to ensure instant updates
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }

        location /api/ {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable caching for all API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }

        location /health {
            proxy_pass http://flask_app/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
