<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QT-Online Window Asia</title>
    <!-- Web App Icons -->
    <link rel="apple-touch-icon" href="/static/img/qt-icon.png">
    <link rel="icon" sizes="192x192" href="/static/img/qt-icon.png">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Sarabun -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #dbeafe 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Split Layout */
        .login-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Left Side: Branding/Logo Section */
        .brand-side {
            flex: 1.2;
            background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.8), rgba(224, 242, 254, 0.4));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
            border-right: 1px solid rgba(37, 99, 235, 0.1);
        }

        .brand-side::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .company-logo {
            max-width: 450px;
            width: 90%;
            height: auto;
            margin-bottom: 24px;
            animation: fadeInScale 1s ease-out;
        }

        .brand-headline {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
            text-align: center;
        }

        .brand-desc {
            font-size: 16px;
            color: var(--text-muted);
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
        }

        /* Right Side: Login Form Section */
        .form-side {
            flex: 0.8;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            backdrop-filter: blur(5px);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            padding: 48px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            animation: slideInRight 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: #94a3b8;
            width: 18px;
            height: 18px;
        }

        .input-field {
            width: 100%;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.2s;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
        }

        .login-btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .alert {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .qr-section {
            margin-top: 24px;
            text-align: center;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .secondary-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        #qrContainer {
            margin-top: 16px;
            display: none;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        #loginQr {
            width: 130px;
            height: 130px;
            margin: 0 auto;
        }

        .system-tag {
            position: absolute;
            bottom: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mobile responsive */
        @media (max-width: 900px) {
            .brand-side {
                display: none;
            }

            .form-side {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <!-- Left: Branding -->
        <div class="brand-side">
            <img src="/company-logo.png" alt="Window Asia Logo" class="company-logo">
            <h2 class="brand-headline">Window Asia Quotation On-Line</h2>
            <p class="brand-desc">The leading manufacturer in Asia. Professional Quotation Management & Tracking System.</p>
            <div class="system-tag">QT-Online System v{{ version }}</div>
        </div>

        <!-- Right: Login Form -->
        <div class="form-side">
            <div class="login-card">
                <div class="form-header">
                    <h1 class="form-title">Welcome Back</h1>
                    <p class="form-subtitle">Please enter your credentials to login</p>
                </div>

                <div id="errorAlert" class="alert"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="label">Username</label>
                        <div class="input-wrapper">
                            <i data-lucide="user" class="input-icon"></i>
                            <input type="text" class="input-field" id="username" placeholder="Employee ID / Name"
                                value="{{ username }}" required autofocus>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="label">Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input type="password" class="input-field" id="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                            </button>
                        </div>
                    </div>

                    <input type="text" id="website" style="display:none;">

                    <button type="submit" class="login-btn" id="loginBtn">
                        <span>Login</span>
                    </button>
                </form>

                <div class="qr-section">
                    <button type="button" class="secondary-btn" id="toggleQrBtn">
                        <i data-lucide="qr-code" style="width: 14px; height: 14px;"></i>
                        <span id="qrBtnText">Mobile QR Login</span>
                    </button>

                    <div id="qrContainer">
                        <img id="loginQr" src="" alt="Access QR">
                        <p style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">Scan to access on mobile
                            device</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // QR Code Logic
        document.addEventListener("DOMContentLoaded", function () {
            var currentUrl = window.location.origin;
            var qrImg = document.getElementById("loginQr");
            if (qrImg) {
                qrImg.src = "/qrcode?base_url=" + encodeURIComponent(currentUrl);
            }
        });

        // Toggle QR Visibility
        const toggleQrBtn = document.getElementById('toggleQrBtn');
        const qrContainer = document.getElementById('qrContainer');
        const qrBtnText = document.getElementById('qrBtnText');

        toggleQrBtn.addEventListener('click', function () {
            if (qrContainer.style.display === 'block') {
                qrContainer.style.display = 'none';
                qrBtnText.textContent = 'Mobile QR Login';
            } else {
                qrContainer.style.display = 'block';
                qrBtnText.textContent = 'Hide QR Code';
            }
        });

        // Password Toggle Logic
        const togglePassBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassBtn.addEventListener('click', function () {
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // Login Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const alert = document.getElementById('errorAlert');

            btn.disabled = true;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<div class="spinner"></div> Signing in...';
            alert.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const website = document.getElementById('website').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, website })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/';
                } else {
                    alert.textContent = data.error || 'Login failed';
                    alert.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            } catch (err) {
                alert.textContent = 'Connection error';
                alert.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });
    </script>

</body>

</html>
